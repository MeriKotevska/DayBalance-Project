<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add a habit · DayBalance</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header app-header"><div class="container"><a class="brand" href="dashboard.html"><i class="brand-mark"></i>DayBalance</a><nav class="user-nav"><a href="dashboard.html">Dashboard</a><a class="active" href="habits.html">My Habits</a><a href="progress.html">Progress</a><a href="tips.html">Tips</a></nav><a class="profile-link" href="index.html">Profile · Logout</a></div></header><main class="container"><div class="page-intro"><span class="eyebrow">Your routine</span><h1 class="display">Add a Habit</h1><p>Choose one small action and give it a clear place in your day.</p></div><section class="surface form-panel"><form class="form-stack" action="habits.html"><div class="field"><label for="habit-name">Habit name</label><input id="habit-name" type="text" placeholder="e.g. Morning walk" required></div><div class="field"><label for="description">Description</label><textarea id="description" placeholder="What would you like to do?"></textarea></div><div class="form-row"><div class="field"><label for="category">Category</label><select id="category"><option>Choose a category</option><option>Hydration</option><option>Movement</option><option>Nutrition</option><option>Sleep</option><option>Mental Health</option><option>Productivity</option></select></div><div class="field"><label for="time">Time of day</label><select id="time"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div></div><div class="form-row"><div class="field"><label for="frequency">Frequency</label><select id="frequency"><option>Every day</option><option>Weekdays</option><option>Weekends</option><option>Custom</option></select></div><div class="field"><label for="duration">Duration</label><input id="duration" type="text" placeholder="e.g. 20 minutes"></div></div><div class="form-row"><div class="field"><label for="difficulty">Difficulty</label><select id="difficulty"><option>Easy</option><option>Medium</option><option>Challenging</option></select></div><div class="field"><label for="reminder">Reminder time</label><input id="reminder" type="time"></div></div><label class="toggle"><input type="checkbox" checked><span><strong>Active habit</strong><br><span class="hint">Include this habit in your daily plan.</span></span></label><div class="hint">You can change any of these details later.</div><div class="button-row"><button class="btn btn-primary" type="submit">Add Habit</button><a class="btn btn-secondary" href="habits.html">Cancel</a></div></form></section></main></body></html>
