<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · DayBalance</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-shell"><section class="auth-box"><a class="brand auth-brand" href="index.html"><i class="brand-mark"></i>DayBalance</a><h1 class="display">Start with one good habit.</h1><p>Create your DayBalance profile and build a routine that feels like yours.</p><form class="form-stack" action="dashboard.html"><div class="field"><label for="name">Your name</label><input id="name" type="text" placeholder="Maria Silva" required></div><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="form-row"><div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="Create a password" required></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" placeholder="Repeat password" required></div></div><span class="hint">Use at least 8 characters with a mix of letters and numbers.</span><div class="error-hint">Example validation message: passwords do not match.</div><button class="btn btn-primary" type="submit">Create account</button></form><div class="auth-links"><a href="login.html">Already have an account?</a><a href="index.html">← Back to home</a></div></section></main></body></html>
