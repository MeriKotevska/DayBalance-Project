<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit habit · DayBalance</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header app-header"><div class="container"><a class="brand" href="dashboard.html"><i class="brand-mark"></i>DayBalance</a><nav class="user-nav"><a href="dashboard.html">Dashboard</a><a class="active" href="habits.html">My Habits</a><a href="progress.html">Progress</a><a href="tips.html">Tips</a></nav><a class="profile-link" href="index.html">Profile · Logout</a></div></header><main class="container"><div class="page-intro"><span class="eyebrow">Your routine</span><h1 class="display">Edit Habit</h1><p>Keep the parts that work and adjust what no longer fits.</p></div><section class="surface form-panel"><form class="form-stack" action="habit-details-user.html"><div class="field"><label for="habit-name">Habit name</label><input id="habit-name" type="text" value="Morning Walk" required></div><div class="field"><label for="description">Description</label><textarea id="description">Start the day with fresh air and a gentle 30-minute walk.</textarea></div><div class="form-row"><div class="field"><label for="category">Category</label><select id="category"><option selected>Movement</option><option>Hydration</option><option>Nutrition</option></select></div><div class="field"><label for="time">Time of day</label><select id="time"><option selected>Morning</option><option>Afternoon</option><option>Evening</option></select></div></div><div class="form-row"><div class="field"><label for="frequency">Frequency</label><select id="frequency"><option selected>Every day</option><option>Weekdays</option><option>Weekends</option><option>Custom</option></select></div><div class="field"><label for="duration">Duration</label><input id="duration" type="text" value="30 minutes"></div></div><div class="form-row"><div class="field"><label for="difficulty">Difficulty</label><select id="difficulty"><option selected>Easy</option><option>Medium</option><option>Challenging</option></select></div><div class="field"><label for="reminder">Reminder time</label><input id="reminder" type="time" value="08:00"></div></div><label class="toggle"><input type="checkbox" checked><span><strong>Active habit</strong><br><span class="hint">Include this habit in your daily plan.</span></span></label><div class="button-row"><button class="btn btn-primary" type="submit">Save Changes</button><a class="btn btn-secondary" href="habits.html">Cancel</a></div></form></section></main></body></html>
